name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [vantagram]

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Write build configuration
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          cat > vantagram-config.json <<EOF
          {
            "bundle_id": "ph.telegra.Telegraph",
            "api_id": "$TG_API_ID",
            "api_hash": "$TG_API_HASH",
            "team_id": "C67CF9S4VU",
            "app_center_id": "0",
            "is_internal_build": "true",
            "is_appstore_build": "false",
            "appstore_id": "0",
            "app_specific_url_scheme": "tg",
            "premium_iap_product_id": "",
            "enable_siri": false,
            "enable_icloud": false
          }
          EOF

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: ~/telegram-bazel-cache
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock') }}
          restore-keys: bazel-${{ runner.os }}-

      - name: Refresh expired fake provisioning profiles
        run: bash build-system/vantagram-refresh-profiles.sh build-system/fake-codesigning vantagram-codesigning

      - name: Build
        env:
          # Ad-hoc signing ("-"): no keychain identity needed; Sideloadly/AltStore re-sign anyway.
          VANTAGRAM_BAZEL_ARGS: "--@build_bazel_rules_apple//apple/build_settings:signing_certificate_name=-"
        run: |
          set -o pipefail
          python3 build-system/Make/Make.py \
            --overrideBazelVersion \
            --cacheDir="$HOME/telegram-bazel-cache" \
            build \
            --configurationPath=vantagram-config.json \
            --codesigningInformationPath=vantagram-codesigning \
            --buildNumber=1 \
            --configuration=release_arm64 > build.log 2>&1 || {
              echo "---- first errors ----"
              grep -m1 -A25 "ERROR:" build.log | cut -c1-500
              echo "---- tail ----"
              tail -n 15 build.log | cut -c1-300
              df -h / | tail -1
              exit 1
            }

      - name: Locate IPA
        run: |
          ls -la bazel-bin/Telegram/*.ipa
          mkdir -p out
          cp bazel-bin/Telegram/Telegram.ipa out/Vantagram-unsigned.ipa
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Vantagram-unsigned-ipa
          path: out/Vantagram-unsigned.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
